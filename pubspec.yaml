name: i
description: "I — campus social app"
publish_to: 'none'

version: 1.0.0+11

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.2
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  image_picker: ^1.1.2
  # Video playback for Duo/group post videos and ping video replies
  # (added 2026-10-06 — nothing in the app played video before).
  video_player: ^2.9.2
  camera: ^0.11.0
  gal: ^2.3.1
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.1
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  flutter_image_compress: ^2.3.0
  uuid: ^4.4.0
  image: ^4.3.0
  path: ^1.9.0
  path_drawing: ^1.0.1
  package_info_plus: ^10.1.0
  flutter_dotenv: ^6.0.1
  # Community composer: PDF attachments and opening them in the system
  # viewer — the app previously had no file picker of any kind and no way
  # to open an external document at all.
  file_picker: ^12.1.3
  url_launcher: ^6.3.1
  google_mlkit_face_detection: ^0.15.1
  google_mlkit_commons: ^0.13.0
  # Remote push (FCM) only. firebase_core is the unavoidable initializer
  # firebase_messaging depends on — neither ships analytics collection, and
  # firebase_analytics is deliberately absent: the live Privacy Policy states
  # the app uses no third-party analytics SDK. Do not add it, and do not add
  # the `firebase-analytics` native artifact in android/app/build.gradle.kts,
  # even though Firebase's console walkthrough suggests both.
  # flutter_local_notifications above stays — it renders the foreground
  # heads-up banner; firebase_messaging only delivers the payload.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_volume_controller: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # .env must be bundled as an asset for flutter_dotenv to read it at
  # runtime (see main.dart's dotenv.load call). The file itself is
  # gitignored — only its presence as a build input is declared here.
  assets:
    - .env
    # Face mask filter preset(s) — see lib/features/face_filter/.
    - assets/masks/
    # The app icon, reused for showcase-only branding (splash screen, login
    # wordmark) — explicit request: "Cliq" and the app logo, in good font,
    # shown only on the home screen and login page, nowhere else. See
    # AppStrings.appName's own doc for the same boundary.
    - assets/brand/
  # Single variable font covering weights 500/600/700/800 (Anonymous feed
  # spec §1.1) — no `weight:` key needed per Flutter's variable-font
  # support; TextStyle(fontFamily: 'Manrope', fontWeight: ...) resolves
  # against the font's own weight axis at render time.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
